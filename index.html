      <h2>Research</h2>
      <p>
        <strong>Predicting In-Game Spending Behaviour Using Machine Learning: An Economic and
        Behavioural Analysis</strong> — MSc thesis, MSc Data Analytics for Business, Kedge
        Business School (2026), supervised by Dr. Tianyuan Zhang. Five public datasets covering
        more than 50,000 players and 52,000 games, combining a logistic baseline, a thirteen-model
        machine-learning benchmark, k-means segmentation and NLP. Engagement and demographic
        features showed no reliable association with spending (all classifiers at chance, ROC AUC
        0.48–0.52), while revenue proved extremely concentrated (Gini 0.87; the top 1% of payers
        account for 39% of revenue). The same pipeline reached 0.95 AUC on genuine game-level
        data, indicating that credible prediction requires real player-level telemetry.
        <a href="/research/Zyad-Husseini-MSc-Thesis-Predicting-In-Game-Spending.docx">Read the thesis</a>.
      </p>
      <p>
        <strong>The Impact of Renewable Energy Adoption on Economic Growth</strong> —
        econometrics research paper, Department of Economics, The American University in Cairo
        (2025). Panel analysis of World Bank World Development Indicators across 7 countries,
        1990–2023, using OLS, robust OLS, maximum likelihood, fixed effects and 2SLS
        instrumental-variable estimation. Renewable energy consumption is consistently
        associated with slower short-run GDP per capita growth (−1.44 percentage points per
        unit, p = 0.029 under 2SLS), while gross capital formation is positive and highly
        significant.
